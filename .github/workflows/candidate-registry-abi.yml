name: Candidate Registry ABI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vectors:
    name: Candidate ABI artifact checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sage-spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: spec
      - name: Checkout the Go core (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage
          ref: main
          path: sage
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sage/go.mod
          cache-dependency-path: sage/go.sum
      - name: Set up Python for candidate metadata checks
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Inspect candidate Registry ABI without contract execution
        working-directory: sage
        env:
          GOTOOLCHAIN: auto
          SAGE_CANDIDATE_ROOT: ${{ github.workspace }}/spec/proposals/management-security-binding
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/spec"
          go test -v -count=1 -covermode=atomic -coverprofile="$target/candidate-abi.cover" "$SAGE_CANDIDATE_ROOT/abi_check.go" "$SAGE_CANDIDATE_ROOT/abi_check_test.go" > "$target/candidate-abi-unit.log" 2>&1
          cat "$target/candidate-abi-unit.log"
          go tool cover -func="$target/candidate-abi.cover" > "$target/candidate-abi-coverage.txt"
          cat "$target/candidate-abi-coverage.txt"
          python3 - "$target/candidate-abi-coverage.txt" <<'PYCODE'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          total = [line for line in text.splitlines() if line.startswith("total:")]
          if len(total) != 1 or float(total[0].split()[-1].removesuffix("%")) < 90:
              raise SystemExit("candidate ABI checker coverage is below 90%")
          PYCODE
          go run "$SAGE_CANDIDATE_ROOT/abi_check.go" -abi "$SAGE_CANDIDATE_ROOT/contract-abi.json" -signatures "$SAGE_CANDIDATE_ROOT/contract-signatures.json" > "$target/candidate-abi-result.json"
          outcome="$SAGE_CANDIDATE_ROOT/outcomes"
          SAGE_OUTCOMES_ROOT="$outcome" go test -v -count=1 -covermode=atomic -coverprofile="$target/candidate-outcomes.cover" "$outcome/check.go" "$outcome/check_test.go" > "$target/candidate-outcomes-unit.log" 2>&1
          cat "$target/candidate-outcomes-unit.log"
          go tool cover -func="$target/candidate-outcomes.cover" > "$target/candidate-outcomes-coverage.txt"
          cat "$target/candidate-outcomes-coverage.txt"
          python3 - "$target/candidate-outcomes-coverage.txt" <<'PYCODE'
          import pathlib, sys
          rows = [line for line in pathlib.Path(sys.argv[1]).read_text().splitlines() if line.startswith("total:")]
          if len(rows) != 1 or float(rows[0].split()[-1].removesuffix("%")) < 90:
              raise SystemExit("candidate outcome checker coverage is below 90%")
          PYCODE
          go run "$outcome/check.go" -abi "$outcome/abi.json" -schemas "$outcome/schemas.json" > "$target/candidate-outcomes-result.json"
          python3 - > "$target/chain-map-unit.log" 2>&1 <<'PYCODE'
          import hashlib, json, os, pathlib, sys, trace, unittest
          root = pathlib.Path(os.environ["SAGE_CANDIDATE_ROOT"]).resolve()
          target = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "spec"
          sys.path.insert(0, str(root))
          suite = unittest.defaultTestLoader.discover(str(root), "test_chain_map.py")
          tracer = trace.Trace(count=True, trace=False)
          result = tracer.runfunc(unittest.TextTestRunner(verbosity=2).run, suite)
          source = root / "check_chain_map.py"
          executable = set(trace._find_executable_linenos(str(source)))
          observed = {line for (name, line), count in tracer.results().counts.items() if pathlib.Path(name).resolve() == source and count > 0}
          covered = executable & observed
          percent = 100 * len(covered) / len(executable) if executable else 0
          coverage = {"scope": "candidate metadata checker only; no Registry execution", "python": sys.version,
                      "source_sha256": hashlib.sha256(source.read_bytes()).hexdigest(),
                      "executable_lines": sorted(executable), "covered_lines": sorted(covered),
                      "statements": len(executable), "covered": len(covered), "percent": percent,
                      "tests_run": result.testsRun, "unit_success": result.wasSuccessful()}
          (target / "chain-map-coverage.json").write_text(json.dumps(coverage, indent=2) + "\n")
          print(json.dumps(coverage))
          if not result.wasSuccessful() or result.testsRun != 7 or percent < 90:
              raise SystemExit("candidate command map unit or coverage gate failed")
          PYCODE
          cat "$target/chain-map-unit.log"
          python3 "$SAGE_CANDIDATE_ROOT/check_chain_map.py" > "$target/chain-map-result.json"
          go list -m -json github.com/ethereum/go-ethereum > "$target/candidate-abi-module.json"
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "spec"
          proposal = "proposals/management-security-binding/"
          inputs = [proposal + name for name in ["README.md", "web-history.md", "verification-plan.md", "lifecycle-and-schemas.md", "contract-design.md", "account-binding.md", "contract-execution-model.md", "outcomes/abi.json", "outcomes/schemas.json", "outcomes/check.go", "outcomes/check_test.go", "contract-state-and-history.md", "chain-command-map.json", "check_chain_map.py", "test_chain_map.py", "contract-abi.json", "contract-signatures.json", "abi_check.go", "abi_check_test.go"]] + [".github/workflows/candidate-registry-abi.yml"]
          outputs = ["candidate-abi-unit.log", "candidate-abi.cover", "candidate-abi-coverage.txt", "candidate-abi-result.json", "candidate-abi-module.json", "candidate-outcomes-unit.log", "candidate-outcomes.cover", "candidate-outcomes-coverage.txt", "candidate-outcomes-result.json", "chain-map-unit.log", "chain-map-coverage.json", "chain-map-result.json"]
          module = json.loads((root / "candidate-abi-module.json").read_text())
          if "Replace" in module or module.get("Path") != "github.com/ethereum/go-ethereum" or not module.get("Sum") or not module.get("Version"):
              raise SystemExit("unbound candidate ABI library identity")
          receipt = {
              "scope": "candidate ABI artifact and normal codec only; no contract execution or protocol verdict",
              "checkout": subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=root, text=True).strip(),
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], cwd=root, text=True).strip(),
              "core_checkout": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "core_manifests_sha256": {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in ["go.mod", "go.sum"]},
              "go_version": subprocess.check_output(["go", "version"], text=True).strip(),
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha256": {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in inputs + outputs},
          }
          (root / "candidate-abi-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PYCODE
      - name: Preserve candidate ABI artifact evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-registry-abi
          if-no-files-found: error
          path: |
            spec/candidate-abi-unit.log
            spec/candidate-abi.cover
            spec/candidate-abi-coverage.txt
            spec/candidate-abi-result.json
            spec/candidate-abi-module.json
            spec/candidate-abi-receipt.json
            spec/candidate-outcomes-unit.log
            spec/candidate-outcomes.cover
            spec/candidate-outcomes-coverage.txt
            spec/candidate-outcomes-result.json
            spec/chain-map-unit.log
            spec/chain-map-coverage.json
            spec/chain-map-result.json
