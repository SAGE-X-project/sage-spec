name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vectors:
    name: Vectors verify against the Go core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sage-spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: spec
      - name: Checkout the Go core (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage
          ref: main
          path: sage
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sage/go.mod
          cache-dependency-path: sage/go.sum
      - name: Validate JSON
        run: |
          for f in spec/vectors/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
      - name: Check vectors
        working-directory: sage
        env:
          GOTOOLCHAIN: auto
        run: go run ./cmd/sage-vectors check -dir "$GITHUB_WORKSPACE/spec/vectors"
      - name: Inspect candidate Registry ABI without contract execution
        working-directory: sage
        env:
          GOTOOLCHAIN: auto
          SAGE_CANDIDATE_ROOT: ${{ github.workspace }}/spec/proposals/management-security-binding
        run: |
          set -euo pipefail
          target="$GITHUB_WORKSPACE/spec"
          go test -v -count=1 -covermode=atomic -coverprofile="$target/candidate-abi.cover" "$SAGE_CANDIDATE_ROOT/abi_check.go" "$SAGE_CANDIDATE_ROOT/abi_check_test.go" > "$target/candidate-abi-unit.log" 2>&1
          cat "$target/candidate-abi-unit.log"
          go tool cover -func="$target/candidate-abi.cover" > "$target/candidate-abi-coverage.txt"
          cat "$target/candidate-abi-coverage.txt"
          python3 - "$target/candidate-abi-coverage.txt" <<'PYCODE'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text()
          total = [line for line in text.splitlines() if line.startswith("total:")]
          if len(total) != 1 or float(total[0].split()[-1].removesuffix("%")) < 90:
              raise SystemExit("candidate ABI checker coverage is below 90%")
          PYCODE
          go run "$SAGE_CANDIDATE_ROOT/abi_check.go" -abi "$SAGE_CANDIDATE_ROOT/contract-abi.json" -signatures "$SAGE_CANDIDATE_ROOT/contract-signatures.json" > "$target/candidate-abi-result.json"
          go list -m -json github.com/ethereum/go-ethereum > "$target/candidate-abi-module.json"
          python3 - <<'PYCODE'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]) / "spec"
          proposal = "proposals/management-security-binding/"
          inputs = [proposal + name for name in ["README.md", "web-history.md", "verification-plan.md", "lifecycle-and-schemas.md", "contract-design.md", "contract-abi.json", "contract-signatures.json", "abi_check.go", "abi_check_test.go"]] + [".github/workflows/check.yml"]
          outputs = ["candidate-abi-unit.log", "candidate-abi.cover", "candidate-abi-coverage.txt", "candidate-abi-result.json", "candidate-abi-module.json"]
          module = json.loads((root / "candidate-abi-module.json").read_text())
          if "Replace" in module or module.get("Path") != "github.com/ethereum/go-ethereum" or not module.get("Sum") or not module.get("Version"):
              raise SystemExit("unbound candidate ABI library identity")
          receipt = {
              "scope": "candidate ABI artifact and normal codec only; no contract execution or protocol verdict",
              "checkout": subprocess.check_output(["git", "rev-parse", "HEAD"], cwd=root, text=True).strip(),
              "tree": subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], cwd=root, text=True).strip(),
              "core_checkout": subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip(),
              "core_manifests_sha256": {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in ["go.mod", "go.sum"]},
              "go_version": subprocess.check_output(["go", "version"], text=True).strip(),
              "run_id": os.environ["GITHUB_RUN_ID"], "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "sha256": {name: hashlib.sha256((root / name).read_bytes()).hexdigest() for name in inputs + outputs},
          }
          (root / "candidate-abi-receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          PYCODE
      - name: Preserve candidate ABI artifact evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: candidate-registry-abi
          if-no-files-found: error
          path: |
            spec/candidate-abi-unit.log
            spec/candidate-abi.cover
            spec/candidate-abi-coverage.txt
            spec/candidate-abi-result.json
            spec/candidate-abi-module.json
            spec/candidate-abi-receipt.json

  markdown:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check relative links resolve
        run: |
          status=0
          for f in README.md spec/*.md vectors/README.md; do
            dir=$(dirname "$f")
            for link in $(grep -oE '\]\(([^)#]+)' "$f" | sed 's/](//' | grep -vE '^https?://'); do
              if [ ! -e "$dir/$link" ] && [ ! -e "$link" ]; then
                echo "$f: broken link $link"; status=1
              fi
            done
          done
          exit $status

  mcp-setup-proposal:
    name: MCP design and historical proposal consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-inspector
          ref: 58cffde89e45096b12d834fb562ea856d46b1c0b
          path: .inspector
      - name: Check document controls and planned cases
        run: |
          python3 -B analysis/build-current-design-overlay.py --check
          python3 proposals/non-http-mcp-setup/verify.py --self-test
          python3 proposals/non-http-mcp-setup/verify.py
          python3 proposals/non-http-mcp-setup/verify_addendum.py --self-test
          python3 proposals/non-http-mcp-setup/verify_addendum.py
          python3 -B proposals/non-http-mcp-setup/verify_resolutions.py --self-test
          python3 -B proposals/non-http-mcp-setup/verify_resolutions.py
          python3 -B proposals/non-http-mcp-setup/consolidate.py --check
          python3 -B proposals/non-http-mcp-setup/test_integrate_admission.py
          python3 -B proposals/non-http-mcp-setup/integrate_admission.py --check
          python3 -B verification/test_mcp_adoption.py
          python3 -B verification/check_mcp_adoption.py
          python3 -B verification/test_post_adoption_errata.py
          python3 -B verification/check_post_adoption_errata.py
          python3 -B verification/test_mcp_errata_candidate.py
          python3 -B verification/check_mcp_errata_candidate.py
          python3 -B verification/test_mcp_errata_adoption.py
          python3 -B verification/check_mcp_errata_adoption.py
          python3 -B verification/test_spec_revision_adoption.py
          python3 -B verification/check_spec_revision_adoption.py
          python3 -B verification/test_mcp_evidence_adoption.py
          python3 -B verification/check_mcp_evidence_adoption.py --inspector-root .inspector
          python3 -B verification/test_mcp_external_review_package.py
          python3 -B verification/check_mcp_external_review_package.py --inspector-root .inspector
          python3 -B verification/test_mcp_independent_llm_review.py
          python3 -B verification/check_mcp_independent_llm_review.py --inspector-root .inspector
          python3 -B verification/test_mcp_independent_llm_rereview.py
          python3 -B verification/check_mcp_independent_llm_rereview.py
          python3 -B verification/test_registry_proof_revision.py
          python3 -B verification/check_registry_proof_revision.py
          python3 -B verification/test_registry_proof_adoption.py
          python3 -B verification/check_registry_proof_adoption.py --inspector-root .inspector
          python3 -B verification/check_standards_scope_revision.py
          python3 -B verification/test_standards_clause_revision.py
          python3 -B verification/check_standards_clause_revision.py
