name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  vectors:
    name: Vectors verify against the Go core
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sage-spec
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: spec
      - name: Checkout the Go core (main)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage
          ref: main
          path: sage
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: sage/go.mod
          cache-dependency-path: sage/go.sum
      - name: Validate JSON
        run: |
          for f in spec/vectors/*.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done
      - name: Check vectors
        working-directory: sage
        env:
          GOTOOLCHAIN: auto
        run: go run ./cmd/sage-vectors check -dir "$GITHUB_WORKSPACE/spec/vectors"

  markdown:
    name: Markdown links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check relative links resolve
        run: |
          status=0
          for f in README.md spec/*.md vectors/README.md; do
            dir=$(dirname "$f")
            for link in $(grep -oE '\]\(([^)#]+)' "$f" | sed 's/](//' | grep -vE '^https?://'); do
              if [ ! -e "$dir/$link" ] && [ ! -e "$link" ]; then
                echo "$f: broken link $link"; status=1
              fi
            done
          done
          exit $status

  mcp-setup-proposal:
    name: MCP design and historical proposal consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SAGE-X-project/sage-inspector
          ref: 58cffde89e45096b12d834fb562ea856d46b1c0b
          path: .inspector
      - name: Check document controls and planned cases
        run: |
          python3 proposals/non-http-mcp-setup/verify.py --self-test
          python3 proposals/non-http-mcp-setup/verify.py
          python3 proposals/non-http-mcp-setup/verify_addendum.py --self-test
          python3 proposals/non-http-mcp-setup/verify_addendum.py
          python3 -B proposals/non-http-mcp-setup/verify_resolutions.py --self-test
          python3 -B proposals/non-http-mcp-setup/verify_resolutions.py
          python3 -B proposals/non-http-mcp-setup/consolidate.py --check
          python3 -B proposals/non-http-mcp-setup/test_integrate_admission.py
          python3 -B proposals/non-http-mcp-setup/integrate_admission.py --check
          python3 -B verification/test_mcp_adoption.py
          python3 -B verification/check_mcp_adoption.py
          python3 -B verification/test_post_adoption_errata.py
          python3 -B verification/check_post_adoption_errata.py
          python3 -B verification/test_mcp_errata_candidate.py
          python3 -B verification/check_mcp_errata_candidate.py
          python3 -B verification/test_mcp_errata_adoption.py
          python3 -B verification/check_mcp_errata_adoption.py
          python3 -B verification/test_spec_revision_adoption.py
          python3 -B verification/check_spec_revision_adoption.py
          python3 -B verification/test_mcp_evidence_adoption.py
          python3 -B verification/check_mcp_evidence_adoption.py --inspector-root .inspector
          python3 -B verification/test_mcp_external_review_package.py
          python3 -B verification/check_mcp_external_review_package.py --inspector-root .inspector
          python3 -B verification/test_mcp_independent_llm_review.py
          python3 -B verification/check_mcp_independent_llm_review.py --inspector-root .inspector
          python3 -B verification/test_registry_proof_revision.py
          python3 -B verification/check_registry_proof_revision.py
          python3 -B verification/test_registry_proof_adoption.py
          python3 -B verification/check_registry_proof_adoption.py --inspector-root .inspector
