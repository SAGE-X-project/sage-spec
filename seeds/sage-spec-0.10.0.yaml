# Seed format version is distinct from the target SAGE protocol version.
# Generated from the approved interview in this conversation, without an MCP session.
# ambiguity_score is a local advisory estimate, not an MCP measurement.
goal: >-
  SAGE의 문서를 X-bar 기반으로, 코드를 AST 기반으로 분석하고 목적·비전과 연결하여,
  RFC에 근거한 sage-spec 0.10.0의 프로토콜 규격·보안 통합 프로파일·구현 가이드와
  분석 그래프, sage-inspector 검증 계획, 저장소별 역할 및 이행 설계를 작성한다.
task_type: documentation
target_protocol_version: 0.10.0
brownfield_context:
  project_type: brownfield
  context_references:
    - path: /Users/0xtopaz/work/github/sage-x-project/sage-spec
      role: primary
      summary: 명세와 이번 산출물의 소유자. 인터뷰 시 HEAD f4a4e7f.
    - path: /Users/0xtopaz/work/github/sage-x-project/sage
      role: reference
      summary: Go 구현과 기존 분석. HEAD c7709b7; 미추적 contracts/는 보존하고 사용 시 별도 출처 표시.
    - path: /Users/0xtopaz/work/github/sage-x-project/rs-sage-core
      role: reference
      summary: Rust Core의 기존 구현을 비교할 읽기 전용 자료. HEAD 206bbbb.
    - path: /Users/0xtopaz/work/github/sage-x-project/sage-inspector
      role: reference
      summary: 후속 명세 준수 검사 구현의 소유자. HEAD 05b890d. 이번에는 검사 계약과 계획만 정의.
  existing_patterns:
    - 기존 spec 장, charter, PROCESS, vectors 및 문서·코드 그래프를 재검증해 활용한다.
    - 기존 구현은 증거이며 규범이 아니다. 보안상 필요한 비호환 변경을 허용한다.
    - 실행 시작 시 실제 커밋과 작업 트리 상태를 기록하고 기존 분석의 오래된 주장을 구분한다.
  existing_dependencies:
    - 기존 AST 분석 도구는 적용 가능성을 확인해 재사용하며 새 생성 도구는 개발하지 않는다.
constraints:
  - 산출물은 sage-spec 안에 보관한다. 다른 저장소는 읽기 전용이며 사용자 변경을 보존한다.
  - 제품 코드, 새 그래프 생성 도구, 새 실행 테스트 벡터·검증 도구를 구현하지 않는다.
  - 실제 저장소 분리·코드 이전, Core·SDK·MCP·데모·서비스 및 inspector 구현은 후속 작업이다.
  - 목표 버전은 0.10.0이다. 기존 1.0.0-draft 표기의 재정의와 비호환 변경을 이력에 설명한다.
  - Agent Client의 사용자 원본 보관·검증 로직과 기준 해시는 신뢰한다.
  - 서명 키와 필수 검증 경로는 조작 가능한 일반 Plugin·MCP·Skill로부터 보호되는 신뢰 경계에 둔다.
  - 정상 등록 이후 Plugin·MCP·Skill의 조작과 메시지 교체·변조를 보호 범위에 포함한다.
  - 생성·Agent Card 작성·등록 단계부터 장악되어 잘못 등록된 경우는 제외하고 버전 미지정 후속 검토로 남긴다.
  - 사용자 승인 팝업은 필수가 아니다. 필수 프로토콜 검증은 프롬프트·LLM 선택·우회 설정에 의존하지 않는다.
  - 보호 대상 실행은 검증 성공 이후에만 허용한다. 검증 누락·실패·연결 장애·시간 초과 시 실행을 거부하고 문제를 알린다.
  - hook API는 구현 선택이다. 보안 통합 프로파일은 개입 지점·우회 방지·실패 동작·실행 인자 일치를 규정한다.
  - MCP 보안 기능은 신뢰하는 실행 로직이 강제 호출하며 LLM의 선택적 도구 호출만으로 준수를 주장하지 않는다.
  - 사전 해시는 구성요소 변경 검출에 사용한다. 해시 검사 이후 교체와 실제 실행 대상의 결합을 다룬다.
  - 서명을 의미적 안전성의 증명으로 취급하지 않는다. 정상 변환의 승인과 승인 이후 변조 검출 책임을 구분한다.
  - 핵심 wire 규격은 Go·Rust·FFI·SDK 구현에 종속되지 않는다.
  - RFC 원문과 적용 가능한 정오표를 확인하고 채택·프로파일링·미채택 이유를 출처와 함께 기록한다.
  - 실제 보안 입증이나 모든 취약점 제거를 선언하지 않는다. 미검증 주장과 후속 입증 방법을 표시한다.
acceptance_criteria:
  - description: >-
      문서의 X-bar 분류와 AST 코드 관계, 목적·비전, 명세와 구현의 일치·차이가 출처와 함께
      추적된다. JSON 노드·엣지의 식별자와 참조가 유효하고 Markdown·Mermaid 뷰와 대응한다.
      관찰된 AST 관계와 해석한 의미 관계가 구별되며 분석 대상·제외 항목·기준 커밋이 기록된다.
    expected_artifacts: [analysis/graphs.json, analysis/graphs.md, analysis/purpose-and-vision.md]
  - description: >-
      0.10.0 규격이 DID·Agent Card·등록 및 해석·키 수명주기·인증·핸드셰이크·세션·요청과 응답을
      일관되게 정의한다. 메시지 형식, 필드와 한도, 상태 전이, 오류와 복구가 명확하며
      상호운용·보안 판정을 바꾸는 미결정 사항이 없다. RFC 근거와 버전 전환 이력이 존재한다.
    expected_artifacts: [spec, charter.md, PROCESS.md, CHANGELOG.md]
  - description: >-
      통합 프로파일이 신뢰 경계, 원본과 파생 실행 요청의 관계, 구성요소 해시 검사,
      실행 전 검증과 응답 사용 전 검증, 우회·검증 장애 시 거부를 정의한다.
      구현 가이드는 Agent·MCP의 필수 경로와 제품별 hook 기능의 한계를 분리하며
      보호된 검증 코드·키·기준값이 제공되어야 한다는 전제를 명시한다.
    expected_artifacts: [profiles/agent-mcp-security.md, guides/integration.md]
  - description: >-
      각 규범 요구사항은 위협·조항·검증 사례에 연결되고, inspector 계획은 입력·기대 결과·실패 조건을
      정의한다. 정상·변조·재전송·순서 변경·동시 요청·키 교체와 폐기·재시작·시간 초과·검증 장애·
      잘못된 인코딩·크기 경계·우회 사례를 다룬다. 동적 시험·상호운용·형식 검증이 필요한 주장과
      미검증 상태를 명시하고 기존 검사 자산과 신규 필요 항목을 구별한다.
    expected_artifacts: [verification/traceability.json, verification/inspector-plan.md]
  - description: >-
      저장소별 역할·소유권·의존 방향과 이행 설계가 기존 sage의 책임을 대응시킨다.
      Go sage와 Rust rs-sage-core의 라이브러리, 이를 사용하는 다언어 SDK,
      예제·데모와 SAGE 유무 보안 비교, Agent·MCP 등록·조회 서비스, inspector를 다루며
      신규 저장소 이름은 제안으로 표시한다. 실제 코드 이동이나 구현 변경은 없다.
    expected_artifacts: [architecture/repository-roles.md, architecture/migration-plan.md]
  - description: >-
      납품 검토 기록에서 위 산출물의 추적 관계, 링크·그래프 참조, 규범 간 모순,
      보안·상호운용에 영향을 주는 미결정 항목을 확인할 수 있다. 각 기준의 근거와 판정,
      실행하지 않은 검사 및 남은 후속 작업이 명시되며 이를 보안 입증 완료로 표현하지 않는다.
    expected_artifacts: [verification/review.md]
